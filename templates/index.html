<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GraphitiBot – AI-powered knowledge graph chatbot backed by Neo4j Aura and Graphiti." />
  <title>GraphitiBot | Neo4j Knowledge Graph AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- ── Ambient Background ─────────────────────────────────────────────── -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- ── App Shell ──────────────────────────────────────────────────────── -->
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" role="complementary" aria-label="Sidebar navigation">
      <div class="sidebar-header">
        <div class="logo-mark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="13" stroke="url(#grad1)" stroke-width="2"/>
            <circle cx="14" cy="8"  r="3" fill="url(#grad1)"/>
            <circle cx="8"  cy="20" r="3" fill="url(#grad2)"/>
            <circle cx="20" cy="20" r="3" fill="url(#grad2)"/>
            <line x1="14" y1="11" x2="8"  y2="17" stroke="url(#grad1)" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="14" y1="11" x2="20" y2="17" stroke="url(#grad1)" stroke-width="1.5" stroke-linecap="round"/>
            <defs>
              <linearGradient id="grad1" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#38bdf8"/>
              </linearGradient>
              <linearGradient id="grad2" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#34d399"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="logo-text">GraphitiBot</span>
      </div>

      <nav class="sidebar-nav" aria-label="Mode selection">
        <button class="nav-item active" id="btn-chat-mode" data-mode="chat" aria-pressed="true">
          <span class="nav-icon">💬</span>
          <span>Chat</span>
        </button>
        <button class="nav-item" id="btn-ingest-mode" data-mode="ingest" aria-pressed="false">
          <span class="nav-icon">📥</span>
          <span>Ingest</span>
        </button>
        <button class="nav-item" id="btn-query-mode" data-mode="query" aria-pressed="false">
          <span class="nav-icon">🔍</span>
          <span>Query</span>
        </button>
      </nav>

      <div class="sidebar-tips">
        <h3 class="tips-heading">Quick Tips</h3>
        <ul class="tips-list" id="tips-list">
          <li>Say <code>remember that …</code> to store a fact</li>
          <li>Say <code>add fact: …</code> to ingest data</li>
          <li>Ask any question to query the graph</li>
        </ul>
      </div>

      <div class="sidebar-status">
        <span class="status-dot" id="status-dot" aria-hidden="true"></span>
        <span class="status-label" id="status-label">Connecting…</span>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-area" id="chat-area" role="main">

      <!-- Header -->
      <header class="chat-header">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true">
          <span></span><span></span><span></span>
        </button>
        <div class="header-title">
          <h1>Knowledge Graph AI</h1>
          <p class="header-subtitle" id="mode-subtitle">Chat mode — I'll auto-detect ingest vs. query</p>
        </div>
        <button class="clear-btn" id="clear-btn" aria-label="Clear conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>
          </svg>
          Clear
        </button>
      </header>

      <!-- Messages -->
      <section class="messages-container" id="messages-container" aria-live="polite" aria-label="Chat messages">
        <!-- Welcome message injected by JS -->
      </section>

      <!-- Input Bar -->
      <footer class="input-bar" role="contentinfo">
        <div class="input-wrapper" id="input-wrapper">
          <textarea
            id="user-input"
            class="user-input"
            rows="1"
            placeholder="Ask a question or say 'remember that…' to add a fact…"
            aria-label="Message input"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <button class="send-btn" id="send-btn" aria-label="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="input-hint">
          Powered by <strong>Graphiti</strong> · <strong>Neo4j Aura</strong> · <strong>OpenAI</strong>
        </p>
      </footer>

    </main>
  </div>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
